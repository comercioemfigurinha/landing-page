<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#b2005e">
  <meta name="robots" content="noindex,nofollow">
  <title>Em manutenção | Comércio em Figurinha</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" href="icone.ico">
  <style>
    :root{--pink:#b2005e;--pink-dark:#7f0143;--ink:#281006;--muted:#735f68;--cream:#fff3f7;--line:#f1d4df}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:28px;font-family:Inter,system-ui,sans-serif;color:var(--ink);background:linear-gradient(135deg,#fff 0%,var(--cream) 100%)}
    main{width:min(680px,100%);text-align:center}
    img{width:150px;max-width:48vw;margin-bottom:28px}
    .panel{background:#fff;border:1px solid var(--line);border-radius:24px;padding:42px 28px;box-shadow:0 22px 70px rgba(127,1,67,.12)}
    .eyebrow{display:inline-block;margin-bottom:14px;border-radius:999px;background:var(--cream);color:var(--pink);font-size:12px;font-weight:900;letter-spacing:.12em;padding:9px 14px}
    h1{font-family:"Baloo 2",Inter,sans-serif;font-size:clamp(38px,7vw,64px);line-height:.95;margin:0 0 16px;color:var(--pink-dark)}
    p{margin:0 auto;color:var(--muted);font-size:17px;line-height:1.65;max-width:520px}
    .actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:30px}
    a{display:inline-flex;align-items:center;justify-content:center;border-radius:14px;padding:14px 18px;font-weight:800;text-decoration:none}
    .whats{background:#128c7e;color:#fff}
    .ghost{border:1px solid var(--line);color:var(--pink-dark);background:#fff}
    small{display:block;margin-top:24px;color:#9a7b87}
    @media(max-width:520px){.panel{padding:34px 20px}.actions{flex-direction:column}a{width:100%}}
  </style>
</head>
<body>
  <main>
    <img src="assets/logo.webp" alt="Comércio em Figurinha" width="800" height="800" decoding="async">
    <section class="panel" aria-labelledby="titulo">
      <span class="eyebrow">AJUSTES EM ANDAMENTO</span>
      <h1 id="titulo">Estamos em manutenção</h1>
      <p>Estamos preparando uma experiência melhor para você escolher e receber suas figurinhas com mais clareza. Voltamos em breve.</p>
      <div class="actions">
        <a class="whats" href="https://wa.me/5518996961409" target="_blank" rel="noopener">Falar pelo WhatsApp</a>
      </div>
      <small>Comércio em Figurinha</small>
    </section>
  </main>
</body>
</html>
