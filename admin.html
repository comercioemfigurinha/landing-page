<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Painel | Comércio em Figurinha</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <style>
    [hidden]{display:none!important}
    body{background:#fff8f2;color:var(--ink);min-height:100vh}button{border:0;cursor:pointer;font:inherit}
    #gate{min-height:100vh;display:grid;place-items:center;padding:24px}.gate-card{width:min(420px,100%);background:#fff;border-radius:24px;padding:32px;box-shadow:0 18px 55px rgba(70,35,15,.12)}
    .gate-card h2{font:800 28px "Baloo 2";margin:0 0 5px}.gate-card p{color:var(--muted);font-size:14px;margin:0 0 20px}.gate-card input{width:100%;border:1px solid var(--line);border-radius:12px;padding:14px 15px;font:inherit;margin-bottom:12px;outline:none}.gate-card input:focus{border-color:var(--orange);box-shadow:0 0 0 3px rgba(255,105,0,.1)}.gate-card button{width:100%}.gate-error{color:#c62828;font-size:13px;min-height:18px;margin-bottom:6px}
    header{background:#fff;padding:16px max(4vw,20px);display:flex;justify-content:space-between;align-items:center;gap:15px;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}header h1{font:800 clamp(18px,3vw,25px) "Baloo 2"}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{padding:9px 13px;border-radius:10px}
    main{max-width:1300px;margin:0 auto;padding:26px max(4vw,20px) 60px}.status{color:var(--muted);font-size:13px}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.filters-label{width:100%;font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase}.filters button{background:#fff;border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:12px}.filters button.active{background:var(--ink);color:#fff}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:18px}.empty{text-align:center;color:var(--muted);padding:60px}
    .card{background:#fff;border-radius:20px;padding:20px;box-shadow:0 10px 30px rgba(60,30,15,.06);display:flex;flex-direction:column;gap:11px}.card-top{display:flex;gap:14px;align-items:center}.card-top img,.card-top .noimg{width:62px;height:62px;border-radius:14px;object-fit:cover;background:#fff1e8;display:grid;place-items:center;color:var(--orange);flex-shrink:0}.card-top h3{font-size:18px}.card-top small{color:var(--muted)}.row{display:flex;justify-content:space-between;gap:10px;font-size:13px;border-top:1px solid var(--line);padding-top:10px}.pill{display:inline-block;background:var(--cream);color:var(--orange);font-weight:800;font-size:12px;padding:4px 10px;border-radius:999px}.pill.pago{background:#e5f7ee;color:#1a8a4a}.pill.recusado,.pill.reembolsado{background:#fdeaea;color:#c62828}.status-select{border:1px solid var(--line);border-radius:9px;padding:7px;font:700 12px Inter;background:#fff}.frases{font-size:12px;color:var(--muted);white-space:pre-wrap;background:var(--cream);border-radius:12px;padding:10px;max-height:120px;overflow:auto}.card-links{display:flex;gap:7px;flex-wrap:wrap}.card-links a,.card-links button{flex:1;text-align:center;font-size:12px;font-weight:800;padding:9px;border-radius:9px;background:var(--ink);color:#fff;min-width:76px}.card-links .whats{background:#128c7e}.card-links .checkout-link{background:var(--orange)}.card-links .btn-danger{background:#b42318}
    @media(max-width:650px){header{align-items:flex-start;flex-direction:column}.actions{width:100%}.actions button{flex:1}.gate-card{padding:24px}}
  </style>
</head>
<body>
  <div id="gate">
    <div class="gate-card">
      <h2>Painel de pedidos</h2>
      <p>Entre com o usuário administrador cadastrado no Supabase.</p>
      <div class="gate-error" id="gateError" role="status" aria-live="polite"></div>
      <input type="email" id="emailInput" placeholder="E-mail" autocomplete="username" autofocus>
      <input type="password" id="senhaInput" placeholder="Senha" autocomplete="current-password">
      <button class="btn-primary" id="entrarBtn">Entrar com segurança</button>
    </div>
  </div>
  <div id="painel" hidden>
    <header><h1>Comércio em Figurinha — <b>Painel</b></h1><div class="actions"><button class="btn-ghost" id="refreshBtn"><i class="fa-solid fa-rotate"></i> Atualizar</button><button class="btn-ghost" id="exportBtn"><i class="fa-solid fa-file-csv"></i> Exportar CSV</button><button class="btn-ghost" id="sairBtn">Sair</button></div></header>
    <main><p class="status" id="status"></p><div class="filters" id="filters"></div><div class="grid" id="grid"></div></main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
